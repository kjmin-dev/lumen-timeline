name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: npm run fmt:check
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:dist
      - run: npm run parity
      - run: npm run api:check
      - run: npm run docs:check

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: rustup toolchain install 1.100.0 --profile minimal --target wasm32-unknown-unknown --component rustfmt
      - run: rustfmt +1.100.0 --edition 2024 --check packages/media/wasm/peaks.rs
      - run: npm run wasm:check

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:pcm
      - run: npm run verify:timeline
      - run: npm run verify:audio
      - run: npm run verify:milestone
      - run: npm run verify:takes
      - run: npm run verify:studio
      - run: npm run verify:lines
      - run: npm run verify:waveforms
      - run: npm run verify:peaks
      - run: npm run verify:scale
      - run: node examples/vanilla/verify-scale.mjs chromium webgl2
      - run: npm run verify:renderers
        env:
          LUMEN_SOFTWARE_GPU: "1"
      - run: npm run verify:shared
