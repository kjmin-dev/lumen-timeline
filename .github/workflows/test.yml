name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: npm run fmt:check
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:dist
      - run: npm run parity
      - run: npm run api:check
      - run: npm run docs:check

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:pcm
      - run: npm run verify:timeline
      - run: npm run verify:audio
      - run: npm run verify:milestone
      - run: npm run verify:takes
